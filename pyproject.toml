[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gated-answer-competition"
version = "0.1.0"
description = "Gated Answer Competition (GAC) for FastV research"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]
llava-next = ["transformers>=4.43", "pillow>=10"]

[project.scripts]
gac-attack = "gac_attack.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
